name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go tool golangci-lint run
      - run: go test ./...
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cellarkeep
          POSTGRES_PASSWORD: cellarkeep
          POSTGRES_DB: cellarkeep_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U cellarkeep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cellarkeep:cellarkeep@localhost:5433/cellarkeep_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -p 1 ./...
