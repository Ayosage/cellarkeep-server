services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cellarkeep
      POSTGRES_PASSWORD: cellarkeep
      POSTGRES_DB: cellarkeep
    ports: ["5434:5432"]   # 5432 is the host's Homebrew Postgres
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cellarkeep"]
      interval: 3s
      timeout: 3s
      retries: 10
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cellarkeep
      POSTGRES_PASSWORD: cellarkeep
      POSTGRES_DB: cellarkeep_test
    ports: ["5433:5432"]
  server:
    profiles: ["prod"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://cellarkeep:cellarkeep@db:5432/cellarkeep
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (32+ random characters)}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?set CLIENT_ORIGIN to the web client URL}
      ADDR: ":8080"
    ports: ["8080:8080"]
volumes: { dbdata: {} }
